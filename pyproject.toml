[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathgennie"
dynamic = ["version"]
description = "Adaptive short-burst molecular dynamics path generation for AMBER, GROMACS, and OpenMM."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Dibyendu Maity" }
]
keywords = [
  "molecular-dynamics",
  "adaptive-sampling",
  "amber",
  "gromacs",
  "openmm"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "numpy",
  "PyYAML",
  "tqdm",
  "MDAnalysis",
  "OpenMM",
  "h5py",
  "pydantic>=2.0",
]

[project.optional-dependencies]
hpc = [
  "mpi4py",
  "dask[distributed]",
]
docs = [
  "mkdocs-material",
  "mkdocstrings[python]",
]
examples = [
  "ParmEd",
]
dev = [
  "pytest",
]
ml = [
  "torch",
]
pathsampling = [
  "openpathsampling",
]

[project.scripts]
pathgennie = "pathgennie.cli.main:main"
pathgennie-amber = "pathgennie.backends.amber.pg_amber:main"
pathgennie-gromacs = "pathgennie.backends.gromacs.pg_gmx:main"
pathgennie-openmm = "pathgennie.backends.openmm.pg_openmm:main"

[tool.setuptools.dynamic]
version = { attr = "pathgennie.__version__" }

[tool.setuptools.packages.find]
include = ["pathgennie*", "pathrefinement*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: longer-running validators (deselect with '-m \"not slow\"')",
]
