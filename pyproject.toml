[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathgennie"
dynamic = ["version"]
description = "Adaptive short-burst molecular dynamics path generation for AMBER, GROMACS, and OpenMM."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Dibyendu Maity" }
]
keywords = [
  "molecular-dynamics",
  "adaptive-sampling",
  "amber",
  "gromacs",
  "openmm"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "numpy",
  "PyYAML",
  "tqdm",
  "MDAnalysis",
  "h5py",
  "pydantic>=2.0",
]

[project.optional-dependencies]
docs = [
  "mkdocs-material",
  "mkdocstrings[python]",
]
examples = [
  "ParmEd",
]
dev = [
  "pytest",
]
ml = [
  "torch",
]
openmm = [
  "OpenMM",
]
analysis = [
  "scikit-learn",
  "matplotlib",
  "joblib",
  "dtaidistance",
]
pathsampling = [
  "openpathsampling",
]

[project.scripts]
pathgennie = "pathgennie.cli.main:main"
pathgennie-amber = "pathgennie.backends.amber.pg_amber:main"
pathgennie-gromacs = "pathgennie.backends.gromacs.pg_gmx:main"
pathgennie-openmm = "pathgennie.backends.openmm.pg_openmm:main"

[tool.setuptools.dynamic]
version = { attr = "pathgennie.__version__" }

[tool.setuptools.packages.find]
include = ["pathgennie*", "pathrefinement*"]
# setuptools' pyproject backend defaults namespaces=true, so directories WITHOUT an
# __init__.py are packaged as namespace packages. That silently shipped
# pathrefinement/examples/ -- 101 KB, the second-largest item in the wheel, including
# verify_mathematical_correctness.py -- into users' site-packages. Nothing in the
# library or the test suite imports it; the example scripts only import each other.
exclude = ["pathrefinement.examples*", "benchmarks*", "we*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: longer-running validators (deselect with '-m \"not slow\"')",
]
