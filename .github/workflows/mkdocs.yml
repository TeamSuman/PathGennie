name: Deploy MkDocs

on:
  push:
    branches:
      - devel
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]"
          
      - name: Deploy MkDocs
        run: mkdocs gh-deploy --force
