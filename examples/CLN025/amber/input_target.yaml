# input_target.yaml - PathGennie CLN025 (Amber) Target Mode
# Goal: Fold chignolin from unfolded to folded structure

amber:
    topology: chignolin.prmtop
    initial_restart: unfolded.rst7
    mdin: mdin
    executable: /opt/amber/bin/sander

pathgennie:
    mode: target
    target_projection: [5.0]  # Target end-to-end CA distance (Angstrom)
    tau1_steps: 5
    tau2_steps: 10
    max_trial: 10
    workers_per_device: 10
    max_cycle: 500
    save_freq: 5
    sigma: 0.05
    temperature: 275
    verbosity: 1
    save_subframes: true
    subframe_stride: 1
    checkpoint_freq: 100
    checkpoint_path: "pathgennie_target_run/checkpoint.h5"
    overwrite: false

md:
    system: implicit
    controls:
        dt: 0.004
        ntpr: 100
        ntwx: 0
        ntwr: 10000

projection:
    module: projection
    function: end_to_end_cv
    start_index: 4
    end_index: 132

convergence:
    module: projection
    function: end_to_end_escaped
    start_index: 4
    end_index: 132
    threshold: 5.0

workdir: pathgennie_target_run
