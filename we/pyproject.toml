[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wepath"
version = "0.1.0"
description = "Weighted-ensemble path simulation utilities."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "openmm",
    "mdtraj",
    "MDAnalysis",
    "joblib",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
